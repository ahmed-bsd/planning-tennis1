<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Planning Tennis Club</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22%3E%3Ccircle cx=%2216%22 cy=%2216%22 r=%2214%22 fill=%22%23C6E02B%22/%3E%3Cpath d=%22M5 9c6 3 6 11 0 14M27 9c-6 3-6 11 0 14%22 stroke=%22white%22 stroke-width=%222.2%22 fill=%22none%22/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700&family=Public+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  --bg:#F4F6F2; --surface:#FFFFFF; --surface2:#EBEFE8; --ink:#17221C; --muted:#5E6B63; --line:#D5DCD3;
  --accent:#2C5BA6; --accent-ink:#FFFFFF; --accent-soft:#E3EBF7;
  --ok:#1E7A46; --ok-soft:#DDF1E4; --warn:#A8620B; --warn-soft:#FBEBD2; --bad:#B42318; --bad-soft:#FBE1DE;
  --display:"Barlow Semi Condensed","Arial Narrow",Arial,sans-serif;
  --body:"Public Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
  --radius:10px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#101613; --surface:#18201B; --surface2:#212B25; --ink:#E7EDE8; --muted:#9AA79F; --line:#2E3A33;
    --accent:#7FA7EA; --accent-ink:#0E1A2E; --accent-soft:#1E2B40;
    --ok:#62C98B; --ok-soft:#173424; --warn:#E9A64C; --warn-soft:#3A2A12; --bad:#F2877D; --bad-soft:#3D1C19;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#101613; --surface:#18201B; --surface2:#212B25; --ink:#E7EDE8; --muted:#9AA79F; --line:#2E3A33;
  --accent:#7FA7EA; --accent-ink:#0E1A2E; --accent-soft:#1E2B40;
  --ok:#62C98B; --ok-soft:#173424; --warn:#E9A64C; --warn-soft:#3A2A12; --bad:#F2877D; --bad-soft:#3D1C19;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:14px/1.45 var(--body);margin:0}
.wrap{max-width:1500px;margin:0 auto;padding-inline:20px;padding-block:18px 60px}
/* app bar */
.appbar{position:sticky;top:0;z-index:30;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:saturate(1.4) blur(10px);-webkit-backdrop-filter:saturate(1.4) blur(10px);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px)}
.appbar-in{max-width:1500px;margin:0 auto;padding:0 20px;height:60px;display:flex;align-items:center;gap:20px}
.brand{display:flex;align-items:center;gap:10px;flex:none;cursor:pointer;border-radius:8px;user-select:none}
.navback{flex:none;width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:600 22px/1 var(--body);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;padding:0 2px 3px 0}
.navback:hover{border-color:var(--accent);color:var(--accent)}
.brand:hover b{color:var(--accent)}
.brand .logo{width:30px;height:30px}
.brand b{display:block;font:700 19px/1 var(--display);letter-spacing:.01em}
.brand small{display:block;font-size:11px;color:var(--muted);letter-spacing:.04em;margin-top:2px}
nav.tabs{display:flex;gap:2px;flex:1;min-width:0;overflow-x:auto;scrollbar-width:none;height:100%;align-items:stretch}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs button{display:inline-flex;align-items:center;gap:7px;background:none;border:0;border-bottom:3px solid transparent;border-top:3px solid transparent;padding:0 12px;font:600 15px var(--display);color:var(--muted);cursor:pointer;white-space:nowrap;letter-spacing:.01em}
nav.tabs button:hover{color:var(--ink)}
nav.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
nav.tabs .ico{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
nav.tabs .l-short{display:none}
.auth{margin-left:auto;flex:none}
.auth .who{max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.auth .ico{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.kpis{display:flex;flex-wrap:wrap;gap:6px 18px;margin-bottom:14px;font-size:13px;color:var(--muted)}
.kpis span b{color:var(--ink);font:600 16px var(--display);font-variant-numeric:tabular-nums;margin-right:3px}
.daychips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin-bottom:12px;padding-bottom:2px}
.daychips::-webkit-scrollbar{display:none}
.daychips button{flex:1 0 auto;min-width:46px;border:1px solid var(--line);background:var(--surface);color:var(--muted);border-radius:10px;padding:6px 8px;font:600 14px var(--display);cursor:pointer;display:flex;flex-direction:column;align-items:center;line-height:1.1}
.daychips button small{font:500 11px var(--body);opacity:.8}
.daychips button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.daychips button.today:not([aria-pressed="true"]){border-color:var(--accent);color:var(--accent)}
.dayview .grid{min-width:0;grid-template-columns:48px repeat(var(--courts),minmax(0,1fr));grid-auto-rows:34px}
.dayview .sess{margin:2px}
.dayview .sess span{font-size:10.5px}
.physlist{display:flex;flex-direction:column}
.physlist .row{display:grid;grid-template-columns:62px 1fr;gap:10px;align-items:center;padding:9px 14px;border-top:1px solid var(--line)}
.physlist .row:first-child{border-top:0}
.physlist .row .t{font:500 13px var(--mono);color:var(--muted)}
h1,h2,h3{font-family:var(--display);margin:0;letter-spacing:.01em;text-wrap:balance}
h1{font-size:30px;font-weight:700}
h2{font-size:22px;font-weight:600}
h3{font-size:18px;font-weight:600}
nav.tabs button:focus-visible,button:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:7px 12px;font:500 13px var(--body);cursor:pointer}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.small{padding:4px 9px;font-size:12px}
.toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-bottom:14px}
.toolbar .spacer{flex:1}
label.inline{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--muted)}
select,input,textarea{font:14px var(--body);color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:7px;padding:6px 8px}
.banner{border-radius:8px;padding:8px 12px;margin-bottom:12px;font-size:13px}
.banner.info{background:var(--accent-soft)}
.banner.bad{background:var(--bad-soft);color:var(--bad)}
.alerts{background:var(--bad-soft);border-radius:8px;padding:10px 14px;margin-bottom:14px;color:var(--bad)}
.alerts ul{margin:4px 0 0;padding-left:18px}
.courts{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,640px),1fr));gap:16px}
.court{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
.court>header{display:flex;justify-content:space-between;align-items:baseline;padding:10px 14px;border-bottom:1px solid var(--line)}
.court>header small{color:var(--muted);font-variant-numeric:tabular-nums}
.scroll{overflow-x:auto}
.grid{display:grid;grid-template-columns:62px repeat(7,minmax(74px,1fr));grid-auto-rows:30px;min-width:580px;position:relative}
.grid .dh{font:600 13px var(--display);text-transform:uppercase;letter-spacing:.05em;color:var(--muted);display:flex;align-items:center;justify-content:center;border-bottom:1px solid var(--line)}
.grid .tl{font:12px var(--mono);color:var(--muted);display:flex;align-items:flex-start;justify-content:flex-end;padding:2px 8px 0 0;font-variant-numeric:tabular-nums;border-right:1px solid var(--line)}
.grid .cell{border-bottom:1px dashed var(--line);border-left:1px solid var(--line);cursor:pointer;position:relative}
.grid .cell.hour{border-bottom-style:solid}
.grid .cell:hover::after{content:"+";position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:16px}
.grid .pcell{border-bottom:1px dashed var(--line);border-left:1px solid var(--line);cursor:pointer;position:relative}
.grid .pcell.hour{border-bottom-style:solid}
.grid .pcell:hover::after{content:"+";position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:16px}
.readonly .grid .pcell{cursor:default}.readonly .grid .pcell:hover::after{content:none}
.physgrid{grid-template-columns:62px repeat(7,minmax(92px,1fr))!important;grid-auto-rows:32px!important;min-width:720px}
.sess.evt{background:repeating-linear-gradient(135deg,var(--warn-soft) 0 6px,var(--surface) 6px 12px);color:var(--ink);border:1.5px solid var(--warn);z-index:3;box-shadow:0 2px 8px rgba(0,0,0,.18)}
.sess.evt b{font-size:12px;color:var(--warn)}
.evts{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:12px;font-size:13px}
.evts .evchip{display:inline-flex;align-items:center;gap:6px;border:1.5px solid var(--warn);background:var(--warn-soft);color:var(--ink);border-radius:8px;padding:4px 9px;font:inherit;font-size:12.5px;cursor:pointer}
.readonly .evts .evchip{cursor:default}
.sess.physc{background:repeating-linear-gradient(45deg,var(--accent-soft) 0 6px,var(--surface) 6px 12px);color:var(--ink);border:1.5px dashed var(--accent)}
.sess.physc b{font-size:12px}
.psess{margin:2px;border:0;border-left:3px solid var(--accent);border-radius:6px;background:var(--accent-soft);color:var(--ink);padding:3px 6px;text-align:left;font:inherit;font-size:11px;line-height:1.25;overflow:hidden;z-index:2;cursor:pointer;display:flex;flex-direction:column;gap:2px;min-width:0}
.readonly .psess{cursor:default}
.psess .pt{font:600 11px var(--mono);color:var(--muted)}
.psess .pc{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.psess .chips{display:flex;flex-wrap:wrap;gap:2px}
.psess .chip{font-size:10px;padding:0 5px;margin:0}
.pcard{display:flex;gap:12px;align-items:center;width:100%;background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:var(--radius);padding:12px 14px;text-align:left;font:inherit;color:inherit;cursor:pointer}
.pcard .pt{font:600 14px/1.2 var(--mono);flex:none;width:56px}
.pcard .pt small{display:block;color:var(--muted);font-weight:400}
.pcard .pi{flex:1;min-width:0}
.pcard .pi b{display:block;margin-bottom:4px}
.form label.chk{flex-direction:row;align-items:center;gap:6px;border:1px solid var(--line);border-radius:8px;padding:6px 9px;color:var(--ink);font-size:13px;cursor:pointer}
.form label.chk input{width:auto}
.checks{display:flex;flex-wrap:wrap;gap:6px}
.swatch.phy{background:var(--accent-soft);color:var(--accent);font-size:10px}
.grid .cell.drop{background:var(--accent-soft)}
.sess{margin:2px 3px;border-radius:6px;padding:3px 6px;overflow:hidden;cursor:grab;z-index:2;display:flex;flex-direction:column;justify-content:center;text-align:center;box-shadow:0 1px 0 rgba(0,0,0,.12);border:0;font:inherit}
.sess b{font:700 15px/1.1 var(--display)}
.sess span{font-size:11px;opacity:.85;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sess.conflict{outline:3px solid var(--bad);outline-offset:-1px}
.sess.dim{opacity:.18}
.sess.dragging{opacity:.4}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px}
.groups{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,280px),1fr));gap:12px}
.gcard{display:flex;flex-direction:column;gap:8px}
.gcard .head{display:flex;align-items:center;gap:10px}
.swatch{width:34px;height:34px;border-radius:8px;display:flex;align-items:center;justify-content:center;font:700 13px var(--display);flex:none}
.gcard .meta{font-size:12px;color:var(--muted)}
.gcard ol{margin:0;padding-left:20px;font-size:13px}
.gcard ol li.empty{color:var(--muted);font-style:italic}
.pill{display:inline-block;border-radius:99px;padding:1px 9px;font-size:12px;font-weight:600;white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.tablewrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius)}
table{border-collapse:collapse;width:100%;min-width:640px}
th,td{text-align:left;padding:8px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
th{font:600 12px var(--body);text-transform:uppercase;letter-spacing:.05em;color:var(--muted);background:var(--surface2)}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
tr:last-child td{border-bottom:0}
.chip{display:inline-block;border-radius:5px;padding:1px 7px;font:600 12px var(--display);margin:1px 2px 1px 0}
.bar{height:8px;border-radius:4px;background:var(--surface2);min-width:80px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent)}
.phys .grid{grid-template-columns:62px repeat(7,minmax(96px,1fr));grid-auto-rows:minmax(34px,auto);min-width:740px}
.phys .pc{border-left:1px solid var(--line);border-bottom:1px dashed var(--line);padding:3px;display:flex;flex-wrap:wrap;align-content:center;gap:2px}
.phys .pc.hour{border-bottom-style:solid}
.phys .prep{border-left:1px solid var(--line);padding:6px 4px;display:flex;flex-direction:column;gap:4px;align-items:stretch;background:var(--surface2)}
.phys .prep select{font-size:12px;padding:4px}
.phys .prep small{font:12px var(--mono);text-align:center;color:var(--muted)}
.muted{color:var(--muted)}
.empty-state{padding:30px;text-align:center;color:var(--muted)}
.confirm-bg{position:fixed;inset:0;background:rgba(10,15,12,.55);display:flex;align-items:center;justify-content:center;padding:16px;z-index:150}
.confirm{background:var(--surface);border-radius:12px;width:min(400px,100%);padding:20px;box-shadow:0 20px 60px rgba(0,0,0,.35)}
.confirm h3{margin:0 0 8px}
.confirm p{margin:0 0 18px;color:var(--muted);font-size:14px}
.confirm .actions{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.btn.danger-solid{background:var(--bad);border-color:var(--bad);color:#fff}
.modal-bg{position:fixed;inset:0;background:rgba(10,15,12,.45);display:flex;align-items:center;justify-content:center;padding:16px;z-index:100}
.modal{background:var(--surface);border-radius:12px;width:min(480px,100%);max-height:90vh;overflow:auto;padding:18px;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.modal h3{margin-bottom:12px}
.form{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.form .full{grid-column:1/-1}
.form label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);font-weight:500}
.form input,.form select,.form textarea{width:100%}
.modal .actions{display:flex;gap:8px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap}
.modal .actions .left{margin-right:auto}
.err{color:var(--bad);font-size:13px;margin-top:8px}
.toast{position:fixed;bottom:calc(16px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:8px;z-index:200;font-size:13px}
.legend{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
@media (max-width:600px){ .form{grid-template-columns:1fr} h1{font-size:25px} }
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
.auth{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
.readonly .cell{cursor:default}
.planlock .grid .cell,.planlock .grid .pcell,.planlock .sess,.planlock .psess,.planlock .pcard{cursor:default}
.planlock .grid .cell:hover::after,.planlock .grid .pcell:hover::after{content:none}
.editbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;border:1.5px solid var(--accent);background:var(--accent-soft);border-radius:8px;padding:8px 12px;margin-bottom:12px;font-size:13px}
.readonly .cell:hover::after{content:none}
.readonly .sess{cursor:default}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:none;padding:7px 12px;font:500 13px var(--body);color:var(--muted);cursor:pointer;border-left:1px solid var(--line)}
.seg button:first-child{border-left:0}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.datenav{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.datefield{position:relative;display:flex;align-items:center;gap:10px;min-width:250px;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:6px 12px;cursor:pointer}
.datefield:hover{border-color:var(--muted)}
.datefield:focus-within{outline:2px solid var(--accent);outline-offset:2px}
.datefield .ico{width:20px;height:20px;fill:none;stroke:var(--accent);stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.datefield .dtxt{flex:1;min-width:0}
.datefield b{display:block;font:600 18px/1.15 var(--display);text-transform:capitalize;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.datefield small{display:block;color:var(--muted);font-size:12px}
.datefield input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;border:0;padding:0}
.datefield input::-webkit-calendar-picker-indicator{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer}
.only-m{display:none}
.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px;display:flex;flex-direction:column;gap:2px}
.stat .k{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.stat .v{font:700 28px/1.1 var(--display);font-variant-numeric:tabular-nums;color:var(--ink)}
.stat .s{font-size:12px;color:var(--muted)}
.stat.hero{border-width:1px 1px 1px 4px}
.stat.hero.ok{border-left-color:var(--ok)} .stat.hero.warn{border-left-color:var(--warn)} .stat.hero.bad{border-left-color:var(--bad)}
.stats-cols{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:14px;margin-bottom:14px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px}
.panel>h3{margin-bottom:2px}
.panel>.sub{font-size:12px;color:var(--muted);margin:0 0 10px}
.panel+.panel,.panel+.tablewrap,.tablewrap+.panel{margin-top:14px}
.section-title{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin:18px 0 8px}
.chart{width:100%;height:auto;display:block;overflow:visible}
.chart .grid-l{stroke:var(--line);stroke-width:1}
.chart .ax{fill:var(--muted);font:11px var(--body)}
.chart .ax-m{fill:var(--muted);font:11px var(--mono)}
.chart .bar{fill:var(--accent)}
.chart .bar.hov{fill:color-mix(in srgb,var(--accent) 80%,var(--ink))}
.chart .val{fill:var(--ink);font:600 12px var(--body)}
.chart .hit{fill:transparent;cursor:default}
.split{display:flex;height:14px;border-radius:7px;overflow:hidden;gap:2px;background:var(--surface);margin:8px 0 12px}
.split i{display:block;height:100%}
.split .P{background:var(--ok)} .split .E{background:var(--warn)} .split .U{background:var(--bad)}
.legend-list{display:flex;flex-direction:column;gap:8px;font-size:13px}
.legend-list div{display:flex;align-items:center;gap:8px}
.legend-list b{margin-left:auto;font-variant-numeric:tabular-nums}
.legend-list small{color:var(--muted);width:44px;text-align:right;font-variant-numeric:tabular-nums}
.ratecell{display:flex;align-items:center;gap:8px;min-width:130px}
.ratecell .bar{flex:1;min-width:50px}
.ratecell .bar i.ok{background:var(--ok)} .ratecell .bar i.warn{background:var(--warn)} .ratecell .bar i.bad{background:var(--bad)}
.ratecell b{width:44px;text-align:right;font-variant-numeric:tabular-nums}
.flag{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;color:var(--bad)}
.hist{display:flex;flex-direction:column}
.hist .row{display:grid;grid-template-columns:120px 60px 1fr auto;gap:10px;align-items:center;padding:9px 0;border-top:1px solid var(--line);font-size:13px}
.hist .row:first-child{border-top:0}

    <button role="tab" data-tab="groupes" id="tab-groupes"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/></svg><span class="l-long">Groupes</span><span class="l-short">Groupes</span></button>
    <button role="tab" data-tab="joueurs" id="tab-joueurs"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg><span class="l-long">Joueurs</span><span class="l-short">Joueurs</span></button>
    <button role="tab" data-tab="entraineurs" id="tab-entraineurs"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg><span class="l-long">Entraîneurs &amp; heures</span><span class="l-short">Coachs</span></button>

<div class="wrap">
  <div class="kpis" id="kpis"></div>
  <div id="banner"></div>
  <main id="view"></main>
  <section class="tools" id="tools" hidden>
    <h3>Sauvegarde</h3>
    <button class="btn" id="exportBtn" type="button">Exporter une sauvegarde (.json)</button>

  </section>

<div id="confirm-root"></div>

<script type="module">
import { backend } from "./js/backend.js";
const DAYS=["Lundi","Mardi","Mercredi","Jeudi","Vendredi","Samedi","Dimanche"];
const DSHORT=["Lun","Mar","Mer","Jeu","Ven","Sam","Dim"];
const NS=9; // 17:00 .. 21:30
const slotLabel=s=>{const m=17*60+s*30;return String(Math.floor(m/60)).padStart(2,"0")+":"+String(m%60).padStart(2,"0")};
const PALETTE=["#FFC000","#E53935","#FFEB3B","#1565C0","#2EAD4B","#CFE0F3","#E0E0E0","#6D6D6D","#B8B8B8","#F48FB1","#7B3FA0","#C65911","#A5D6A7","#90CAF9","#F4B084","#FFE082","#26C6DA","#9CCC65","#D1C4E9","#B71C1C"];
const CATS=[
  {name:"Poussin",levels:["P1","P2"],bg:"#FFE8A3",fg:"#6B4E00"},
  {name:"Benjamin",levels:["B1","B2"],bg:"#C8EBC9",fg:"#1F5A24"},
  {name:"Minime",levels:["M1","M2"],bg:"#CFE0FA",fg:"#1B3F7A"},
  {name:"Cadet",levels:["C1","C2"],bg:"#FFD3B8",fg:"#7A3510"},
  {name:"Junior / Senior",levels:["Junior","Senior"],bg:"#E3D3F5",fg:"#4B2479"}];
const LEVELS=CATS.flatMap(c=>c.levels);
const catOf=l=>CATS.find(c=>c.levels.includes(l));
const levelPill=l=>{if(!l)return "";const c=catOf(l);return c?`<span class="pill" style="background:${c.bg};color:${c.fg}" title="${c.name}">${esc(l)}</span>`:`<span class="pill" style="background:var(--surface2)">${esc(l)}</span>`};
const S={coaches:{},groups:{},players:{},sessions:{},physSessions:{},events:{},attendance:{},settings:{courts:5,physLen:2,preps:{}}};
const isMobile=()=>window.matchMedia("(max-width:760px)").matches;
let planView=null, planDay=(new Date().getDay()+6)%7;
let mode="loading", tab="planning", coachFilter="", playerSearch="", playerGroup="", playerLevel="";
const LS="tennis-planning-local-v1";

const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
function textOn(hex){hex=(hex||"#ccc").replace("#","");if(hex.length===3)hex=hex.split("").map(c=>c+c).join("");const r=parseInt(hex.slice(0,2),16),g=parseInt(hex.slice(2,4),16),b=parseInt(hex.slice(4,6),16);return (0.299*r+0.587*g+0.114*b)<140?"#fff":"#111"}
const h=n=>(n%1?n.toFixed(1):n)+" h";
function toast(msg){const t=document.createElement("div");t.className="toast";t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),2600)}

/* ---------- data layer (Firebase) ---------- */
let planEdit=false;
const canPlan=()=>canEdit&&planEdit;
const planEditBtn=()=>canEdit?`<button type="button" id="planEditBtn" class="btn ${planEdit?"primary":""}" title="${planEdit?"Verrouiller le planning":"Déverrouiller le planning pour le modifier"}">${planEdit?"✓ Terminer":"✏️ Modifier le planning"}</button>`:"";
let user=null, canEdit=false, canMark=false, isAdmin=false, authReady=false, accessReady=false, hasAccess=false, unsubs=[], deniedShown=false;
function saveLocal(){try{localStorage.setItem(LS,JSON.stringify(S))}catch(e){}}
function loadLocal(){try{const d=JSON.parse(localStorage.getItem(LS)||"null");if(d)Object.assign(S,d)}catch(e){}}
function writeError(e){toast(e&&e.code==="permission-denied"?"Action refusée : votre compte n'a pas ce droit.":"Enregistrement impossible, vérifiez la connexion.")}
async function put(col,id,data){
  if(!canEdit){toast("Seul l'administrateur peut modifier.");return}
  if(col==="settings"){S.settings=data}else{S[col][id]=data}
  render();
  if(mode==="firebase"){try{await backend.set(col,id,data)}catch(e){writeError(e)}}
  else saveLocal();
}
async function del(col,id){
  if(!canEdit){toast("Seul l'administrateur peut modifier.");return}
  delete S[col][id];
  render();
  if(mode==="firebase"){try{await backend.remove(col,id)}catch(e){writeError(e)}}
  else saveLocal();
}
async function boot(){
  render();
  if(!backend.configured){mode="local";canEdit=true;canMark=true;isAdmin=true;loadLocal();S.events=S.events||{};cleanExpiredEvents();render();return}
  mode="firebase";
  backend.onAuth(u=>{
    user=u;authReady=true;
    isAdmin=false;canEdit=false;canMark=false;accessReady=false;hasAccess=false;
    unsubs.forEach(f=>f());unsubs=[];
    stopAttendance();
    S.coaches={};S.groups={};S.players={};S.sessions={};S.physSessions={};S.events={};S.settings={courts:5,physLen:2,preps:{}};
    if(u&&u.email){
      let dataOn=false;
      unsubs.push(backend.watchDoc("access",u.email.toLowerCase(),d=>{
        accessReady=true;hasAccess=!!d;
        isAdmin=!!d&&d.role==="admin";canEdit=isAdmin;canMark=!!d;
        if(d&&!dataOn){dataOn=true;
          ["coaches","groups","sessions","players","physSessions"].forEach(col=>unsubs.push(backend.watchCollection(col,o=>{S[col]=o;render()})));
          unsubs.push(backend.watchCollection("events",o=>{S.events=o;cleanExpiredEvents();render()}));
          unsubs.push(backend.watchDoc("settings","main",x=>{if(x)S.settings=Object.assign({courts:5,physLen:2,preps:{}},x);render()}));
        }
        render();
      },()=>{accessReady=true;hasAccess=false;render()}));
    }
    render();
  });
}
function renderAuth(){
  const el=$("#auth");
  if(mode==="local"){el.innerHTML=`<span>Mode local</span>`;return}
  if(mode!=="firebase"){el.innerHTML="";return}
  el.innerHTML=user?`<span class="pill" style="background:${isAdmin?"var(--accent)":"var(--surface2)"};color:${isAdmin?"var(--accent-ink)":"var(--ink)"}">${isAdmin?"Admin":"Coach"}</span><span class="who" title="${esc(user.email)}">${esc(user.email)}</span><button class="btn small" id="logoutBtn" type="button" title="Déconnexion" aria-label="Déconnexion"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/></svg><span class="txt">Déconnexion</span></button>`
    :`<button class="btn small primary" id="loginBtn" type="button">Connexion coach</button>`;
  const lo=$("#logoutBtn");if(lo)lo.onclick=()=>backend.logout().then(()=>toast("Déconnecté"));
  const li=$("#loginBtn");if(li)li.onclick=loginModal;
}
function loginModal(){
  const body=`<div class="form"><label class="full">E-mail<input type="email" name="email" id="f-email" required autocomplete="username"></label>
    <label class="full">Mot de passe<input type="password" name="password" id="f-pass" required autocomplete="current-password"></label></div>`;
  openModal("Connexion coach",body,async f=>{
    try{await backend.login(f.email.trim(),f.password);toast("Connecté")}
    catch(e){return e&&(e.code==="auth/invalid-credential"||e.code==="auth/wrong-password"||e.code==="auth/user-not-found")?"E-mail ou mot de passe incorrect.":e&&e.code==="auth/too-many-requests"?"Trop de tentatives, réessayez dans quelques minutes.":"Connexion impossible, vérifiez votre connexion internet."}
  },null,"Se connecter");
}
async function importDump(dump){
  const cols=["coaches","groups","players","sessions","physSessions","events","attendance","settings"];
  const clean={};cols.forEach(c=>{if(dump&&typeof dump[c]==="object")clean[c]=dump[c]});
  if(!Object.keys(clean).length){toast("Ce fichier n'est pas une sauvegarde du planning.");return}
  if(mode==="firebase"){
    if(clean.coaches){clean.access={};Object.entries(clean.coaches).forEach(([cid,c])=>{if(!c||!c.email)return;const em=String(c.email).toLowerCase();if(em!==((user&&user.email)||"").toLowerCase())clean.access[em]={role:"coach",coachId:cid}})}
    try{const n=await backend.importAll(clean);toast(n+" éléments importés")}catch(e){writeError(e)}
  }else{
    cols.forEach(c=>{if(!clean[c])return;if(c==="settings"){if(clean.settings.main)S.settings=clean.settings.main}else Object.assign(S[c],clean[c])});
    saveLocal();render();toast("Sauvegarde importée");
  }
}
async function exportDump(){
  let attendance=S.attendance;
  if(mode==="firebase"){try{attendance=await backend.getAll("attendance")}catch(e){attendance={};toast("Présences non incluses (accès refusé).")}}
  const dump={coaches:S.coaches,groups:S.groups,players:S.players,sessions:S.sessions,physSessions:S.physSessions,events:S.events,attendance,settings:{main:S.settings}};
  const blob=new Blob([JSON.stringify(dump,null,1)],{type:"application/json"});
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);
  a.download="sauvegarde-planning-"+new Date().toISOString().slice(0,10)+".json";
  document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1000);
}
$("#exportBtn").onclick=exportDump;
$("#importFile").onchange=async e=>{const f=e.target.files[0];e.target.value="";if(!f)return;
  try{await importDump(JSON.parse(await f.text()))}catch(_){toast("Fichier illisible : choisissez un fichier .json de sauvegarde.")}};

/* ---------- derived ---------- */
const groupsSorted=()=>Object.entries(S.groups).sort((a,b)=>String(a[1].code).localeCompare(String(b[1].code),"fr",{numeric:true}));
const coachesSorted=()=>Object.entries(S.coaches).sort((a,b)=>String(a[1].name).localeCompare(String(b[1].name),"fr"));
const G=id=>S.groups[id]; const Cn=id=>(S.coaches[id]||{}).name||"";
function sessList(){return Object.entries(S.sessions).map(([id,s])=>({id,...s})).filter(s=>s.court<=S.settings.courts)}
function overlap(a,b){return a.day===b.day&&a.start<b.start+b.len&&b.start<a.start+a.len}
function conflicts(){
  const list=sessList(),bad=new Set(),msgs=[];
  for(let i=0;i<list.length;i++)for(let j=i+1;j<list.length;j++){
    const a=list[i],b=list[j];if(!overlap(a,b))continue;
    const ga=G(a.groupId),gb=G(b.groupId);
    if(a.court===b.court){bad.add(a.id);bad.add(b.id);msgs.push(`${DAYS[a.day]} : deux séances se chevauchent sur le court ${a.court}.`)}
    else if(a.groupId===b.groupId){bad.add(a.id);bad.add(b.id);msgs.push(`${DAYS[a.day]} : le groupe ${ga?ga.code:"?"} est sur deux courts en même temps.`)}
    else if(ga&&gb&&ga.coachId&&ga.coachId===gb.coachId){bad.add(a.id);bad.add(b.id);msgs.push(`${DAYS[a.day]} ${slotLabel(Math.max(a.start,b.start))} : ${Cn(ga.coachId)} est sur deux courts (${ga.code} et ${gb.code}).`)}
  }
  return {bad,msgs};
}
function groupStats(gid){const ss=sessList().filter(s=>s.groupId===gid);return {count:ss.length,hours:ss.reduce((t,s)=>t+s.len*0.5,0)}}
function physSlots(s){const L=S.settings.physLen||2;const r=[];if(s.start<3){for(let k=s.start+s.len;k<s.start+s.len+L;k++)r.push(k)}else{for(let k=s.start-L;k<s.start;k++)r.push(k)}return r.filter(k=>k>=0&&k<NS)}
function physGrid(){const g=[...Array(7)].map(()=>[...Array(NS)].map(()=>[]));sessList().forEach(s=>{if(!G(s.groupId))return;physSlots(s).forEach(k=>{if(!g[s.day][k].includes(s.groupId))g[s.day][k].push(s.groupId)})});return g}
function coachStats(cid){
  const gids=Object.keys(S.groups).filter(g=>S.groups[g].coachId===cid);
  let n=0,th=0;gids.forEach(g=>{const st=groupStats(g);n+=st.count;th+=st.hours});
  let ph=0,pd=0;
  if(physManual()){const mine=physList().filter(x=>x.coachId===cid);ph=mine.reduce((t,x)=>t+x.len*0.5,0);pd=new Set(mine.map(x=>x.day)).size}
  else{const pg=physGrid();for(let d=0;d<7;d++){if((S.settings.preps||{})[d]===cid){const occ=pg[d].filter(x=>x.length).length;if(occ){pd++;ph+=occ*0.5}}}}
  return {gids,n,th,ph,pd,total:th+ph};
}
function physList(){return Object.entries(S.physSessions||{}).map(([id,x])=>({id,kind:"physique",...x,groupIds:(x.groupIds||[]).filter(g=>G(g))}))}
const physManual=()=>Object.keys(S.physSessions||{}).length>0;
// séances de physique qui occupent un court (champ « court » renseigné)
const physOnCourts=()=>physManual()?physList().filter(x=>+x.court>0).map(x=>({...x,court:+x.court})):[];
const placeLabel=x=>+x.court>0?"Court "+x.court:"Salle";
function physCourtBlock(x,col){
  const codes=x.groupIds.map(g=>G(g).code).join(", ");
  return `<button class="sess physc" type="button" data-editphys="${x.id}" style="grid-row:${x.start+2}/span ${x.len};grid-column:${col}" title="Physique · ${esc(codes)} · ${slotLabel(x.start)}–${slotLabel(x.start+x.len)} · ${esc(Cn(x.coachId)||"sans préparateur")}"><b>PHY</b>${x.len>1?`<span>${esc(codes)}</span>`:""}</button>`;
}
const isPhys=it=>!!it&&it.kind==="physique";
function playersOf(gid){return Object.entries(S.players).filter(([,p])=>p.groupId===gid).sort((a,b)=>(a[1].lastName||"").localeCompare(b[1].lastName||"","fr"))}

/* ---------- render ---------- */
function renderGate(){
  const noAccess=mode==="firebase"&&user&&(!accessReady||!hasAccess);
  const locked=mode==="loading"||(mode==="firebase"&&!user)||noAccess;
  document.body.classList.toggle("locked",locked);
  if(!locked)return false;
  $("#tools").hidden=true;$("#banner").innerHTML="";$("#kpis").innerHTML="";$("#auth").innerHTML="";
  const v=$("#view");
  if(mode==="loading"||!authReady||(user&&!accessReady)){v.innerHTML=`<div class="gate"><p class="muted">Chargement…</p></div>`;return true}
  if(noAccess){
    v.innerHTML=`<div class="gate"><div class="card gate-card"><h2>Accès non autorisé</h2>
      <p class="muted" style="margin:6px 0 16px">Le compte <b>${esc(user.email)}</b> n'a pas encore accès à l'application. Demandez à l'administrateur du club d'ajouter votre e-mail dans votre fiche entraîneur.</p>
      <button class="btn" type="button" id="g-logout">Se déconnecter</button></div></div>`;
    $("#g-logout").onclick=()=>backend.logout();
    return true;
  }
  if(v.querySelector("#g-form"))return true; // keep what the user is typing
  v.innerHTML=`<div class="gate"><form class="card gate-card" id="g-form" novalidate>
    <h2>Connexion</h2><p class="muted" style="margin:4px 0 16px">Espace réservé aux entraîneurs du club.</p>
    <div class="form" style="grid-template-columns:1fr">
      <label>E-mail<input type="email" name="email" id="g-email" required autocomplete="username"></label>
      <label>Mot de passe<input type="password" name="password" id="g-pass" required autocomplete="current-password"></label>
    </div>
    <div class="err" id="g-err" role="alert"></div>
    <button type="submit" class="btn primary" id="g-submit" style="width:100%;justify-content:center;margin-top:14px;padding:10px">Se connecter</button>
    <button type="button" class="btn small" id="g-reset" style="margin-top:10px">Mot de passe oublié ?</button>
  </form></div>`;
  const err=m=>{$("#g-err").textContent=m};
  $("#g-form").onsubmit=async e=>{e.preventDefault();
    const em=$("#g-email").value.trim(),pw=$("#g-pass").value;
    if(!em||!pw){err("Saisissez votre e-mail et votre mot de passe.");return}
    const b=$("#g-submit");b.disabled=true;b.textContent="Connexion…";err("");
    try{await backend.login(em,pw)}
    catch(x){b.disabled=false;b.textContent="Se connecter";
      err(x&&(x.code==="auth/invalid-credential"||x.code==="auth/wrong-password"||x.code==="auth/user-not-found"||x.code==="auth/invalid-email")?"E-mail ou mot de passe incorrect.":x&&x.code==="auth/too-many-requests"?"Trop de tentatives, réessayez dans quelques minutes.":"Connexion impossible, vérifiez votre connexion internet.")}};
  $("#g-reset").onclick=async()=>{const em=$("#g-email").value.trim();if(!em){err("Saisissez d'abord votre e-mail, puis cliquez à nouveau sur « Mot de passe oublié ? ».");return}
    try{await backend.resetPassword(em);err("");toast("Si ce compte existe, un e-mail de réinitialisation vient d'être envoyé.")}catch(x){err(x&&x.code==="auth/too-many-requests"?"Trop de demandes, réessayez plus tard.":"Envoi impossible : vérifiez l'adresse e-mail.")}};
  setTimeout(()=>{const i=$("#g-email");if(i&&!i.value)i.focus()},0);
  return true;
}
function render(){
  const nb=$("#navBack");if(nb)nb.hidden=navDepth<=0||(mode==="firebase"&&!user);
  const se=$("#season");if(se)se.textContent=seasonLabel();
  if(renderGate())return;
  // L'onglet « Entraîneurs & heures » est réservé à l'administrateur.
  $("#tab-entraineurs").hidden=!isAdmin;
  if(tab==="entraineurs"&&!isAdmin){tab="planning";try{history.replaceState(null,"","#planning")}catch(_){}}
  document.querySelectorAll("#tabs button").forEach(b=>b.setAttribute("aria-selected",b.dataset.tab===tab?"true":"false"));
  const ss=sessList();
  const occ=ss.reduce((t,s)=>t+s.len,0), cap=S.settings.courts*7*NS;
  $("#kpis").hidden=tab!=="planning";
  $("#kpis").innerHTML=[
    [Object.keys(S.groups).length,"groupes"],[Object.keys(S.players).length,"joueurs"],
    [ss.length,"séances / semaine"]
  ].map(([v,l])=>`<span><b>${v}</b>${l}</span>`).join("");
  document.body.classList.toggle("readonly",!canEdit);
  document.body.classList.toggle("planlock",!canPlan());
  $("#tools").hidden=!canEdit;
  renderAuth();
  const empty=mode!=="loading"&&!Object.keys(S.groups).length&&!Object.keys(S.sessions).length;
  $("#banner").innerHTML = mode==="loading"?`<div class="banner info">Chargement du planning…</div>`
    : mode==="local"?`<div class="banner info">Firebase n'est pas encore configuré (fichier js/firebase-config.js) : les modifications restent dans ce navigateur.${empty?" Pour démarrer, importez le fichier sauvegarde-initiale.json en bas de page.":""}</div>`
    : empty?`<div class="banner info">Le planning est vide : importez votre fichier <b>sauvegarde-initiale.json</b> avec le bouton « Importer une sauvegarde » en bas de page.</div>`:"";
  const v=$("#view");
  const editBar=canPlan()?`<div class="editbar">✏️ <b>Mode édition</b><span>Les modifications sont enregistrées immédiatement. Cliquez sur « ✓ Terminer » pour reverrouiller le planning.</span><span style="margin-left:auto">📅 ${seasonLabel()} · ${seasonRangeText()}</span></div>`:"";
  if(tab==="planning")v.innerHTML=editBar+viewPlanning()+hoursPanel("tennis");
  else if(tab==="physique")v.innerHTML=editBar+viewPhysique()+hoursPanel("physique");
  else if(tab==="presences")v.innerHTML=viewPresences();
  else if(tab==="groupes")v.innerHTML=viewGroups();
  else if(tab==="joueurs")v.innerHTML=viewPlayers();
  else v.innerHTML=viewCoaches();
  document.querySelectorAll(".tablewrap table").forEach(t=>{const hs=[...t.querySelectorAll("thead th")].map(th=>th.textContent.trim());t.querySelectorAll("tbody tr").forEach(tr=>[...tr.children].forEach((td,i)=>{td.dataset.label=hs[i]||""}))});
  wire();
  syncAttendance();
}

function viewPlanning(){
  const {bad,msgs}=conflicts();
  const legend=groupsSorted().map(([id,g])=>`<span class="chip" style="background:${esc(g.color)};color:${textOn(g.color)}">${esc(g.code)}</span>`).join("");
  const view=planView||(isMobile()?"jour":"semaine");
  let html=`<div class="toolbar">
    <div class="seg" role="group" aria-label="Affichage"><button type="button" data-planview="jour" aria-pressed="${view==="jour"}">Jour</button><button type="button" data-planview="semaine" aria-pressed="${view==="semaine"}">Semaine</button></div>
    ${canPlan()?`<label class="inline"><span class="lbl">Courts</span> <select id="courtsSel" aria-label="Nombre de courts">`:`<label class="inline" hidden><select id="courtsSel" disabled>`}${[1,2,3,4,5,6,7,8].map(n=>`<option value="${n}" ${n===S.settings.courts?"selected":""}>${n} court${n>1?"s":""}</option>`).join("")}</select></label>

  </div>`;

  if(!Object.keys(S.groups).length&&mode!=="loading")html+=`<div class="banner info">Commencez par créer vos groupes dans l'onglet « Groupes », puis cliquez sur une case pour placer une séance.</div>`;

  if(view==="jour")return html+viewPlanningDay(bad);
  html+=`<div class="courts">`;
  const ss=sessList();
  for(let c=1;c<=S.settings.courts;c++){

    html+=`<section class="court"><header><h3>Court ${c}</h3><small>${cs.length} séances${pc.length?" + "+pc.length+" physique":""} · ${h(hrs)}</small></header><div class="scroll"><div class="grid">`;
    html+=`<div style="grid-row:1;grid-column:1;border-right:1px solid var(--line);border-bottom:1px solid var(--line)"></div>`;
    DAYS.forEach((d,i)=>html+=`<div class="dh" style="grid-row:1;grid-column:${i+2}">${DSHORT[i]}</div>`);

      for(let d=0;d<7;d++)html+=`<div class="cell ${s%2?"hour":""}" style="grid-row:${s+2};grid-column:${d+2}" data-court="${c}" data-day="${d}" data-slot="${s}" title="Court ${c} · ${DAYS[d]} ${slotLabel(s)}"></div>`;

    eventsThisWeek().filter(e=>eventCourts(e).includes(c)).forEach(e=>{html+=evtBlock(e,e.day+2)});
    cs.forEach(s=>{
      const g=G(s.groupId)||{code:"?",color:"#999"};
      const dim=coachFilter&&g.coachId!==coachFilter;
      html+=`<button class="sess ${bad.has(s.id)?"conflict":""} ${dim?"dim":""}" draggable="${canPlan()}" data-sess="${s.id}" style="grid-row:${s.start+2}/span ${s.len};grid-column:${s.day+2};background:${esc(g.color)};color:${textOn(g.color)}" title="${esc(g.code)} · ${slotLabel(s.start)}–${slotLabel(s.start+s.len)}"><b>${esc(g.code)}</b>${s.len>1?`<span>${esc(Cn(g.coachId))}</span>`:""}${s.len>2?`<span>${slotLabel(s.start)}–${slotLabel(s.start+s.len)}</span>`:""}</button>`;
    });
    html+=`</div></div></section>`;
  }
  return html+`</div>`;
}

function dayChips(){
  const today=(new Date().getDay()+6)%7;
  return `<div class="daychips" role="group" aria-label="Jour">${DSHORT.map((d,i)=>`<button type="button" data-planday="${i}" aria-pressed="${planDay===i}" class="${i===today?"today":""}">${d}</button>`).join("")}</div>`;

// Disponibilités pour la location : de 08:00 à 23:00 par pas de 30 min, hors entraînements.
const RENT_START=8*60, RENT_END=23*60;
const minLabel=m=>String(Math.floor(m/60)).padStart(2,"0")+":"+String(m%60).padStart(2,"0");
// semaine en cours : du lundi au dimanche contenant aujourd'hui
function weekDates(){const mon=addDays(todayISO(),-dowOf(todayISO()));return DAYS.map((_,i)=>addDays(mon,i))}
// événements encore valables cette semaine (aujourd'hui ou plus tard, jusqu'à dimanche)
function eventsThisWeek(){
  const w=weekDates(),t=todayISO();
  return Object.entries(S.events||{}).map(([id,e])=>({id,...e,day:dowOf(e.date)})).filter(e=>e.date>=t&&e.date<=w[6]).sort((a,b)=>a.date.localeCompare(b.date)||a.startMin-b.startMin);
}
// un événement « tous les courts » est découpé en un bloc par court
const eventCourts=e=>+e.court>0?[+e.court]:[...Array(S.settings.courts)].map((_,i)=>i+1);
let evCleaned=false;
function cleanExpiredEvents(){
  if(!isAdmin||evCleaned)return;evCleaned=true;
  const t=todayISO(),old=Object.entries(S.events||{}).filter(([,e])=>e.date<t).map(([id])=>id);
  if(!old.length)return;
  if(mode==="firebase")old.forEach(id=>backend.remove("events",id).catch(()=>{}));
  else{old.forEach(id=>delete S.events[id]);saveLocal()}
}
// bloc visible dans la grille (17:00 – 21:30) ; renvoie "" si l'événement est hors de la plage affichée
function evtBlock(e,col){
  const s0=Math.max(0,(e.startMin-17*60)/30),s1=Math.min(NS,(e.endMin-17*60)/30);
  if(s1<=s0)return "";
  return `<button class="sess evt" type="button" data-editevt="${e.id}" style="grid-row:${Math.floor(s0)+2}/span ${Math.max(1,Math.ceil(s1)-Math.floor(s0))};grid-column:${col}" title="${esc((e.title||"Événement")+" · "+minLabel(e.startMin)+"–"+minLabel(e.endMin))}"><b>⚑ ${esc(e.title||"Événement")}</b><span>${minLabel(e.startMin)}–${minLabel(e.endMin)}</span></button>`;
}
function eventsBar(){
  const ev=eventsThisWeek();if(!ev.length)return "";
  return `<div class="evts"><b>Événements cette semaine :</b>${ev.map(e=>`<button type="button" class="evchip" data-editevt="${e.id}">⚑ ${esc(parseISO(e.date).toLocaleDateString("fr-FR",{weekday:"short",day:"numeric",month:"short"}))} · ${+e.court>0?"Court "+e.court:"Tous les courts"} · ${minLabel(e.startMin)}–${minLabel(e.endMin)}${e.title?" · "+esc(e.title):""}</button>`).join("")}</div>`;
}
function eventModal(id,preset){
  const w=weekDates(),t=todayISO(),e=id?S.events[id]:Object.assign({title:"",date:t,court:0,startMin:17*60,endMin:19*60},preset||{});
  const days=w.filter(d=>d>=t);
  const times=[];for(let m=RENT_START;m<=RENT_END;m+=30)times.push(m);
  const body=`<div class="form">
    <label class="full">Motif<input name="title" id="f-etitle" maxlength="40" value="${esc(e.title)}" placeholder="Tournoi, travaux, location exceptionnelle…"></label>
    <label>Jour (semaine en cours)<select name="date" id="f-edate">${days.map(d=>opt(d,parseISO(d).toLocaleDateString("fr-FR",{weekday:"long",day:"numeric",month:"long"}),e.date)).join("")}</select></label>
    <label>Court<select name="court" id="f-ecourt">${opt(0,"Tous les courts",+e.court||0)}${[...Array(S.settings.courts)].map((_,i)=>opt(i+1,"Court "+(i+1),+e.court||0)).join("")}</select></label>
    <label>De<select name="startMin" id="f-estart">${times.slice(0,-1).map(m=>opt(m,minLabel(m),e.startMin)).join("")}</select></label>
    <label>À<select name="endMin" id="f-eend">${times.slice(1).map(m=>opt(m,minLabel(m),e.endMin)).join("")}</select></label>
    <p class="muted full" style="margin:0;font-size:12px">L'événement bloque le court uniquement ce jour-là. Il disparaît automatiquement une fois la date passée.</p></div>`;
  openModal(id?"Modifier l'événement":"Nouvel événement",body,f=>{
    const n={title:(f.title||"").trim(),date:f.date,court:+f.court||0,startMin:+f.startMin,endMin:+f.endMin};
    if(!n.date)return "Choisissez un jour.";
    if(n.endMin<=n.startMin)return "L'heure de fin doit être après l'heure de début.";
    // refus si un court concerné est déjà occupé sur ce créneau (tennis, physique sur court ou autre événement)
    const d=dowOf(n.date),courts=eventCourts(n),busyMsg=[];
    const inter=(a0,a1)=>a0<n.endMin&&a1>n.startMin;
    sessList().filter(x=>x.day===d&&courts.includes(x.court)&&inter(17*60+x.start*30,17*60+(x.start+x.len)*30))
      .forEach(x=>busyMsg.push(`court ${x.court} : entraînement ${(G(x.groupId)||{}).code||""} ${slotLabel(x.start)}–${slotLabel(x.start+x.len)}`));
    physOnCourts().filter(x=>x.day===d&&courts.includes(x.court)&&inter(17*60+x.start*30,17*60+(x.start+x.len)*30))
      .forEach(x=>busyMsg.push(`court ${x.court} : physique ${slotLabel(x.start)}–${slotLabel(x.start+x.len)}`));
    Object.entries(S.events||{}).filter(([eid,e])=>eid!==id&&e.date===n.date&&inter(e.startMin,e.endMin)).forEach(([,e])=>eventCourts(e).filter(c=>courts.includes(c))
      .forEach(c=>busyMsg.push(`court ${c} : événement ${e.title||""} ${minLabel(e.startMin)}–${minLabel(e.endMin)}`)));
    if(busyMsg.length)return `Impossible : ${busyMsg.length>1?"des courts sont":"le court est"} déjà occupé${busyMsg.length>1?"s":""} sur ce créneau (${[...new Set(busyMsg)].slice(0,4).join(" ; ")}${busyMsg.length>4?" ; …":""}). Choisissez un autre court ou un autre horaire.`;
    put("events",id||uid(),n);
    toast(id?"Événement modifié":"Événement ajouté");
  },id?()=>{del("events",id);toast("Événement supprimé")}:null);
}

// séances de physique d'un groupe (planning modifiable, sinon calcul automatique)
function groupPhysSessions(gid){
  if(physManual())return physList().filter(x=>x.groupIds.includes(gid)).map(x=>({day:x.day,start:x.start,len:x.len,court:+x.court||0,coachId:x.coachId}));
  return sessList().filter(x=>x.groupId===gid).map(x=>{const sl=physSlots(x);return sl.length?{day:x.day,start:Math.min(...sl),len:sl.length,court:0,coachId:(S.settings.preps||{})[x.day]||""}:null}).filter(Boolean);
}
const printedOn=()=>new Date().toLocaleDateString("fr-FR",{day:"numeric",month:"long",year:"numeric"});
function printGroups(){
  const gs=groupsSorted();if(!gs.length){toast("Aucun groupe à imprimer.");return}
  const d=new Date(),y=d.getMonth()>=8?d.getFullYear():d.getFullYear()-1;

    const line=(label,list,isPhys)=>`<tr><th>${label}</th>${DAYS.map((_,i)=>{const it=list.filter(x=>x.day===i).sort((a,b)=>a.start-b.start);return `<td class="${it.length?"":"rest"}">${cell(it,isPhys)}</td>`}).join("")}</tr>`;

      <div class="gbody">

        <div class="gplayers"><h2>Joueurs</h2>${pl.length?`<ul>${pl.map(([,p])=>`<li><b>${esc(p.lastName||"")}</b> ${esc(p.firstName||"")}</li>`).join("")}</ul>`:`<p style="margin:0;color:#555">Aucun joueur.</p>`}</div>
      </div><div class="pfoot">Imprimé le ${printedOn()}</div></section>`;
  }).join("");
  const pr=$("#print");pr.classList.add("gp");pr.innerHTML=pages;
  const oldTitle=document.title;document.title="Plannings des groupes";
  const done=()=>{document.title=oldTitle;pr.classList.remove("gp")};
  window.addEventListener("afterprint",done,{once:true});

function printCourts(){
  $("#print").classList.remove("gp");
  const C=S.settings.courts,N=(RENT_END-RENT_START)/30,busy={};
  const lbl=a=>{const m=RENT_START+a*30;return String(Math.floor(m/60)).padStart(2,"0")+":"+String(m%60).padStart(2,"0")};
  // séances du planning (créneau 0 = 17:00) converties en créneaux 08:00 – 23:00
  [...sessList(),...physOnCourts()].forEach(x=>{for(let k=x.start;k<x.start+x.len;k++){const a=(17*60+k*30-RENT_START)/30;if(a>=0&&a<N)busy[x.day+"|"+x.court+"|"+a]=true}});
  const evs=eventsThisWeek();
  evs.forEach(e=>eventCourts(e).forEach(c=>{for(let m=e.startMin;m<e.endMin;m+=30){const a=(m-RENT_START)/30;if(a>=0&&a<N)busy[e.day+"|"+c+"|"+a]=true}}));
  // plages occupées (créneaux de 30 min consécutifs regroupés)
  const busyRanges=(d,c)=>{const out=[];let st=null;for(let a=0;a<=N;a++){const b=a<N&&busy[d+"|"+c+"|"+a];if(b&&st===null)st=a;if(!b&&st!==null){out.push([st,a]);st=null}}return out};
  let t=`<table><thead><tr><th style="width:30mm"></th>${[...Array(C)].map((_,c)=>`<th>Court ${c+1}</th>`).join("")}</tr></thead><tbody>`;
  DAYS.forEach((day,d)=>{
    t+=`<tr><th>${day}</th>`;
    for(let c=1;c<=C;c++){
      const r=busyRanges(d,c);
      t+=r.length?`<td>${r.map(([x,y])=>`<span class="rg">${lbl(x)} – ${lbl(y)}</span>`).join("")}</td>`:`<td></td>`;
    }
    t+=`</tr>`;
  });
  t+=`</tbody></table>`;
  $("#print").innerHTML=`<div class="ph"><span></span><h1>Occupation des courts</h1><div class="club">Créneaux réservés par<br>l'école de tennis</div></div>${t}<div class="pfoot">Imprimé le ${printedOn()}</div>`;
  const oldTitle=document.title;document.title="Occupation des courts";
  window.addEventListener("afterprint",()=>{document.title=oldTitle},{once:true});
  window.print();
  setTimeout(()=>{document.title=oldTitle},1500);
}
function viewPlanningDay(bad){

  html+=`<div style="grid-row:1;grid-column:1;border-right:1px solid var(--line);border-bottom:1px solid var(--line)"></div>`;
  for(let c=1;c<=C;c++)html+=`<div class="dh" style="grid-row:1;grid-column:${c+1}">C${c}</div>`;
  for(let sl=0;sl<NS;sl++){
    html+=`<div class="tl" style="grid-row:${sl+2};grid-column:1">${slotLabel(sl)}</div>`;
    for(let c=1;c<=C;c++)html+=`<div class="cell ${sl%2?"hour":""}" style="grid-row:${sl+2};grid-column:${c+1}" data-court="${c}" data-day="${planDay}" data-slot="${sl}" title="Court ${c} · ${DAYS[planDay]} ${slotLabel(sl)}"></div>`;

  return html+`</div></section>`;

function groupPhysHours(gid){

// planned = heures planifiées, target = heures déclarées dans la fiche du groupe
function hoursState(planned,target){
  if(!target)return {cls:"none",txt:h(planned)+" · non déclaré",pct:planned?100:0};
  const d=Math.round((planned-target)*10)/10;
  return {cls:d===0?"ok":d<0?"warn":"bad",txt:(d===0?"✓ ":"")+String(planned).replace(".",",")+" / "+h(target).replace(".",","),pct:Math.min(100,planned/target*100),
    note:d===0?"objectif atteint":d<0?"manque "+h(-d):"dépassement +"+h(d)};
}
function hoursCell(planned,target,label){
  const st=hoursState(planned,target);
  return `<span class="lbl">${label}</span><span class="hbar" title="${esc(label+" : "+(st.note||"non déclaré"))}"><i class="${st.cls}" style="width:${st.pct}%"></i></span><span class="hval ${st.cls}" title="${esc(st.note||"")}"><b>${st.txt}</b></span>`;
}
function hoursPanel(focus){
  // outil de construction du planning : visible seulement en mode édition (administrateur)
  if(!canPlan())return "";

      <span class="hc">${hoursCell(t,tt,"Tennis")}</span><span class="hc">${hoursCell(pz,pt,"Physique")}</span>`}).join("");

  return `<details class="hours" ${open} id="hoursPanel"><summary>Heures par groupe ${todo?`<span class="pill warn">${todo} groupe${todo>1?"s":""} à ajuster</span>`:undeclared?"":`<span class="pill ok">Tous les objectifs sont atteints</span>`}${undeclared?`<span class="pill" style="background:var(--surface2);color:var(--muted)">${undeclared} groupe${undeclared>1?"s":""} sans heures déclarées</span>`:""}<span class="muted" style="font:400 12px var(--body)">planifié / déclaré dans la fiche du groupe · ${focus==="physique"?"physique":"tennis"} mis à jour en direct</span></summary>

// Indicateur affiché dans une fiche de séance : heures du groupe après enregistrement de cette séance.
function hintLines(kind,gids,deltaByGroup){
  const fmt=x=>String(Math.round(x*10)/10).replace(".",",")+" h";
  return gids.filter(g=>G(g)).map(gid=>{const g=G(gid);
    const base=kind==="physique"?groupPhysHours(gid):groupStats(gid).hours,target=kind==="physique"?+g.physHours||0:+g.tennisHours||0;
    const after=Math.round((base+(deltaByGroup[gid]||0))*10)/10,st=hoursState(after,target);
    const msg=!target?`aucune durée prévue dans la fiche du groupe`:after===target?`✓ objectif atteint`:after<target?`il manque ${fmt(target-after)}`:`dépasse de ${fmt(after-target)}`;
    return `<span class="ln"><span class="chip" style="background:${esc(g.color)};color:${textOn(g.color)}">${esc(g.code)}</span><span class="hbar"><i class="${st.cls}" style="width:${st.pct}%"></i></span><span class="hval ${st.cls}" style="width:auto"><b>${fmt(after)}</b>${target?` sur ${fmt(target)} prévues`:""}</span></span><span class="${st.cls==="ok"?"":"muted"}" style="font-size:12px;margin:-3px 0 0 4px;${st.cls==="ok"?"color:var(--ok)":st.cls==="bad"?"color:var(--bad)":st.cls==="warn"?"color:var(--warn)":""}">${esc(g.code)} : ${msg}</span>`}).join("")||`<span class="muted">Choisissez un groupe pour voir ses heures de la semaine.</span>`;
}
function overTargets(kind,gids,deltaByGroup){
  return gids.filter(g=>G(g)).filter(gid=>{const g=G(gid),target=kind==="physique"?+g.physHours||0:+g.tennisHours||0;if(!target)return false;

const STATUS={P:{long:"Présent",short:"P",cls:"ok"},E:{long:"Absence excusée",short:"AE",cls:"warn"},U:{long:"Absence non excusée",short:"ANE",cls:"bad"}};
const iso=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");

// ---------- saison ----------
const seasonStart=()=>S.settings.seasonStart||"";

const fmtY=x=>parseISO(x).toLocaleDateString("fr-FR",{day:"numeric",month:"short",year:"numeric"});
const seasonRangeText=()=>seasonStart()&&seasonEnd()?`du ${fmtY(seasonStart())} au ${fmtY(seasonEnd())}`:"dates non définies";
function seasonModal(){

function sessionsOn(date){

  if(currentKind()==="physique")return (physManual()?physList().filter(x=>x.day===w&&x.groupIds.length&&(!only||x.coachId===mine)):[]).sort((a,b)=>a.start-b.start);

const itemKey=it=>(isPhys(it)?"phys_":"")+it.id+"_"+attDate;

  const values=Array.isArray(playerId)?playerId.map(p=>[p,value]):[[playerId,marks[playerId]===value?null:value]];

}
async function commitMarks(sess){

  const ids=statsGroups(),multi=ids.length>1,docs=histDocs(),to=seasonEnd()&&seasonEnd()<todayISO()?seasonEnd():todayISO(),periodFrom=statsFrom(docs),first=trackingStart(docs);
  if(!first)return html+`<div class="card empty-state">Aucun appel ${kind==="physique"?"de physique":"de tennis"} n'a encore été enregistré${multi?"":" pour ce groupe"}. Les statistiques apparaîtront dès le premier appel.</div>`;
  let from=first>periodFrom?first:periodFrom;
  if(seasonStart()&&from<seasonStart())from=seasonStart();
  const occ=reliable(occurrences(ids,from,to,docs));
  const played=occ.filter(o=>o.status==="played"),off=occ.filter(o=>o.status==="off"),missing=occ.filter(o=>o.status==="missing");
  const T={P:0,E:0,U:0};played.forEach(o=>{T.P+=o.c.P;T.E+=o.c.E;T.U+=o.c.U});
  const tot=T.P+T.E+T.U,rate=pct(T.P,tot);
  if(statsBy==="joueur")return html+playerStats(statsPlayer,ids[0],occ,from,to,first>periodFrom);
  // joueurs à suivre (même règle que le tableau « Par joueur »)
  const flagged=ids.flatMap(gid=>playersOf(gid).map(([pid])=>{const c={P:0,E:0,U:0};played.forEach(o=>{if(o.groupId!==gid)return;const v=((o.doc&&o.doc.marks)||{})[pid];if(c[v]!==undefined)c[v]++});const n=c.P+c.E+c.U;return n&&((c.P/n*100)<75||c.U>=3)})).filter(Boolean).length;
  const who=multi?ids.length+" groupes":esc(G(ids[0]).code+(kind==="physique"?"":" · "+(Cn(G(ids[0]).coachId)||"sans coach")));
  html+=`<p class="muted" style="font-size:13px;margin:-4px 0 12px"><b style="color:var(--ink)">${kind==="physique"?"Physique":"Tennis"}</b> · ${who} · du ${esc(fmtShort(from))} au ${esc(fmtShort(to))}${first>periodFrom?` <span class="pill" style="background:var(--surface2);color:var(--muted);font-weight:500">suivi depuis le premier appel</span>`:""}</p>`;
  // calendrier + jours impraticables
  html+=`<div class="stats-cols">
    <section class="panel"><h3>Calendrier des séances</h3><p class="sub">Survolez un jour pour voir le détail des séances</p>${calendarView(occ,from,to,ids)}</section>
    <section class="panel"><h3>Jours impraticables <span class="pill off" style="margin-left:6px;vertical-align:middle">${new Set(off.map(o=>o.date)).size} jour${new Set(off.map(o=>o.date)).size>1?"s":""} · ${off.length} séance${off.length>1?"s":""}</span></h3><p class="sub">Séances non jouées (court inutilisable)</p>${offDays(occ)}</section>
  </div>`;
  // par groupe
  html+=`<div class="section-title"><h3>${multi?"Par groupe":"Le groupe"}</h3><span class="muted" style="font-size:12px">${multi?"Cliquez sur un groupe pour voir son détail":""}</span></div>${groupCards(ids,occ)}`;
  // par joueur
  const players=ids.flatMap(gid=>playersOf(gid).map(([pid,p])=>({pid,p,gid})));
  const recentByGroup={};ids.forEach(g=>{recentByGroup[g]=played.filter(o=>o.groupId===g).slice(0,10)});
  const rows=players.map(({pid,p,gid})=>{const c={P:0,E:0,U:0};played.forEach(o=>{if(o.groupId!==gid)return;const v=((o.doc&&o.doc.marks)||{})[pid];if(c[v]!==undefined)c[v]++});const n=c.P+c.E+c.U;return {pid,p,gid,c,n,r:pct(c.P,n)}})
    .sort((a,b)=>(a.r??101)-(b.r??101)||(a.p.lastName||"").localeCompare(b.p.lastName||"","fr"));
  html+=`<div class="section-title"><h3>Par joueur</h3><span class="muted" style="font-size:12px">Trié du taux le plus faible au plus élevé</span></div>`;
  if(!rows.length)html+=`<div class="card empty-state">Aucun joueur dans ${multi?"ces groupes":"ce groupe"}.</div>`;
  else{
    html+=`<div class="tablewrap"><table><thead><tr><th>Joueur</th>${multi?"<th>Groupe</th>":""}<th>Niveau</th><th class="num">Présent</th><th class="num">Excusé</th><th class="num">Non excusé</th><th>Taux de présence</th><th>10 dernières séances</th><th>Suivi</th></tr></thead><tbody>`;
    rows.forEach(({pid,p,gid,c,r})=>{const g=G(gid);
      const alert=(r!==null&&r<75)||c.U>=3;
      html+=`<tr><td><b>${esc(p.firstName)} ${esc(p.lastName)}</b></td>${multi?`<td><span class="chip" style="background:${esc(g.color)};color:${textOn(g.color)}">${esc(g.code)}</span></td>`:""}<td>${levelPill(p.level)}</td><td class="num">${c.P}</td><td class="num">${c.E}</td><td class="num">${c.U}</td><td>${rateCell(r)}</td>
        <td class="dots" style="white-space:nowrap">${recentByGroup[gid].map(o=>{const v=((o.doc&&o.doc.marks)||{})[pid];return v?`<span class="dot ${v}" data-tip="${esc(fmtShort(o.date))} ${slotLabel(o.start)} : ${STATUS[v].long}"></span>`:`<span class="dot" style="background:var(--surface2)" data-tip="${esc(fmtShort(o.date))} : non renseigné"></span>`}).join("")||`<span class="muted">—</span>`}</td>
        <td>${alert?`<span class="flag">⚠ À suivre</span>`:r===null?"":`<span class="muted" style="font-size:12px">RAS</span>`}</td></tr>`});
    html+=`</tbody></table></div><p class="muted" style="font-size:12px;margin-top:8px">« À suivre » : taux de présence inférieur à 75 % ou au moins 3 absences non excusées.</p>`;
  }
  return html;
}

// Fenêtre de confirmation : résout true (Oui) ou false (Non / Échap / clic à côté).
function confirmDialog(title,message,okLabel,danger){
  return new Promise(res=>{
    const root=$("#confirm-root");
    root.innerHTML=`<div class="confirm-bg"><div class="confirm" role="alertdialog" aria-modal="true" aria-labelledby="c-title" aria-describedby="c-msg"><h3 id="c-title">${esc(title)}</h3><p id="c-msg">${esc(message)}</p>
      <div class="actions"><button type="button" class="btn" id="c-no">Annuler</button><button type="button" class="btn ${danger?"danger-solid":"primary"}" id="c-yes">${esc(okLabel||"Confirmer")}</button></div></div></div>`;
    const end=v=>{root.innerHTML="";document.removeEventListener("keydown",key,true);res(v)};
    const key=e=>{if(e.key==="Escape"){e.stopPropagation();end(false)}};
    document.addEventListener("keydown",key,true);
    $("#c-no").onclick=()=>end(false);$("#c-yes").onclick=()=>end(true);
    root.querySelector(".confirm-bg").addEventListener("mousedown",e=>{if(e.target.classList.contains("confirm-bg"))end(false)});
    $("#c-no").focus();
  });
}

async function syncAccess(oldEmail,newEmail,coachId){
  if(mode!=="firebase"||oldEmail===newEmail&&!newEmail)return;

  }catch(e){writeError(e)}

    if(!todo.length){toast("Tous les joueurs sont déjà marqués.");return}draftMark(sess,todo,"P")});
  }
  if(!canEdit)return;
  on("#printCourts","click",printCourts);
  on("#printGroups","click",printGroups);
  on("#planEditBtn","click",async()=>{
    if(!planEdit&&!(await confirmDialog("Modifier le planning ?","Le mode édition permet d'ajouter, déplacer ou supprimer des séances. Les modifications sont enregistrées immédiatement pour tout le monde.","Oui, modifier")))return;
    planEdit=!planEdit;toast(planEdit?"Mode édition activé":"Planning verrouillé");render()});
  if(canPlan()){
  on("#addSess","click",()=>sessionModal(null));
  on("#addEvt","click",()=>eventModal(null));
  on("#seasonBtn","click",seasonModal);
  on("[data-editevt]","click",e=>eventModal(e.currentTarget.dataset.editevt));
  on("#courtsSel","change",e=>put("settings","main",{...S.settings,courts:+e.target.value}));
  on(".cell","click",e=>{const d=e.currentTarget.dataset;sessionModal(null,{court:+d.court,day:+d.day,start:Math.min(+d.slot,NS-3)})});
  on(".sess[data-sess]","click",e=>sessionModal(e.currentTarget.dataset.sess));
  on(".sess[data-sess]","dragstart",e=>{dragId=e.currentTarget.dataset.sess;e.currentTarget.classList.add("dragging");e.dataTransfer.effectAllowed="move";try{e.dataTransfer.setData("text/plain",dragId)}catch(_){}});
  on(".sess","dragend",e=>{e.currentTarget.classList.remove("dragging");document.querySelectorAll(".cell.drop").forEach(c=>c.classList.remove("drop"))});
  on(".cell","dragover",e=>{e.preventDefault();e.currentTarget.classList.add("drop")});
  on(".cell","dragleave",e=>e.currentTarget.classList.remove("drop"));
  on(".cell","drop",e=>{e.preventDefault();const d=e.currentTarget.dataset;const s=S.sessions[dragId];if(!s)return;
    const n={...s,court:+d.court,day:+d.day,start:+d.slot};
    if(n.start+n.len>NS){toast("La séance dépasserait 21:30.");render();return}
    const clash=sessList().find(o=>o.id!==dragId&&o.court===n.court&&overlap(o,n));
    if(clash){toast(`Place déjà prise par ${(G(clash.groupId)||{}).code||"un groupe"}.`);render();return}
    if(physOnCourts().some(x=>x.court===n.court&&overlap(x,n))){toast(`Le court ${n.court} est réservé pour le physique à ce moment-là.`);render();return}
    put("sessions",dragId,n);dragId=null});
  on("#genPhys","click",generatePhys);
  on("#addPhys","click",()=>physModal(null));
  on("[data-editphys]","click",e=>physModal(e.currentTarget.dataset.editphys));
  on(".pcell","click",e=>{const d=e.currentTarget.dataset;physModal(null,{day:+d.pday,start:Math.min(+d.pslot,NS-2)})});
  on("#physLen","change",e=>put("settings","main",{...S.settings,physLen:+e.target.value}));
  on("[data-prep]","change",e=>{const preps={...(S.settings.preps||{})};preps[e.target.dataset.prep]=e.target.value;put("settings","main",{...S.settings,preps})});
  }
  on("#addGroup","click",()=>groupModal(null));
  on("[data-editgroup]","click",e=>groupModal(e.currentTarget.dataset.editgroup));
  on("#addPlayer","click",()=>playerModal(null));
  on("[data-editplayer]","click",e=>playerModal(e.currentTarget.dataset.editplayer));
  on("#addCoach","click",()=>coachModal(null));
  on("[data-editcoach]","click",e=>coachModal(e.currentTarget.dataset.editcoach));
}
const ROUTES=["planning","physique","presences","statistiques","groupes","joueurs","entraineurs"];
let navDepth=0;
function routeOf(){return tab==="presences"&&attView==="bilan"?"statistiques":tab}
function applyRoute(r){
  if(r==="statistiques"){tab="presences";attView="bilan"}
  else if(ROUTES.includes(r)){tab=r;if(r==="presences")attView="appel"}
  if(!["planning","physique"].includes(tab))planEdit=false;
}
// aller vers un écran en créant une étape d'historique (le « retour » y ramène)
function go(r){
  if(!ROUTES.includes(r)||r===routeOf())return;
  applyRoute(r);
  try{history.pushState({r},"","#"+r);navDepth++}catch(_){}
  render();window.scrollTo({top:0});
}
window.addEventListener("popstate",e=>{
  navDepth=Math.max(0,navDepth-1);
  // une fiche ou une confirmation ouverte : « retour » la ferme sans changer d'écran
  if($("#modal-root").innerHTML||$("#confirm-root").innerHTML){$("#modal-root").innerHTML="";$("#confirm-root").innerHTML="";return}
  const r=(e.state&&e.state.r)||(location.hash||"#planning").slice(1)||"planning";
  applyRoute(r);render();
});
$("#navBack").addEventListener("click",()=>{try{history.back()}catch(_){}});
{const home=()=>{if(mode==="firebase"&&!user)return;go("planning");window.scrollTo({top:0,behavior:"smooth"})};
  const b=$("#brandHome");b.addEventListener("click",home);b.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();home()}})}
document.querySelectorAll("#tabs button").forEach(b=>b.addEventListener("click",()=>go(b.dataset.tab)));
$("#season").textContent=seasonLabel();
{let wasMobile=isMobile();window.addEventListener("resize",()=>{const m=isMobile();if(m!==wasMobile){wasMobile=m;render()}})}
{const hs=(location.hash||"").slice(1);if(ROUTES.includes(hs))applyRoute(hs);try{history.replaceState({r:routeOf()},"","#"+routeOf())}catch(_){}}
// ---------- déconnexion automatique après inactivité ----------
const IDLE_MINUTES=30;               // durée d'inactivité avant déconnexion
const WARN_BEFORE_MS=60*1000;        // avertissement 1 minute avant
let lastActivity=Date.now(),idleWarned=false;
const markActive=()=>{lastActivity=Date.now()};
["pointerdown","keydown","wheel","touchstart","scroll"].forEach(ev=>window.addEventListener(ev,markActive,{passive:true,capture:true}));
async function checkIdle(){
  if(mode!=="firebase"||!user)return;
  const idle=Date.now()-lastActivity,limit=IDLE_MINUTES*60*1000;
  if(idle>=limit){
    idleWarned=false;$("#confirm-root").innerHTML="";$("#modal-root").innerHTML="";
    await backend.logout();toast(`Déconnecté après ${IDLE_MINUTES} minutes d'inactivité.`);return;
  }
  if(idle>=limit-WARN_BEFORE_MS&&!idleWarned){
    idleWarned=true;
    const stay=await confirmDialog("Toujours là ?",`Sans activité, vous serez déconnecté dans une minute pour protéger les données du club.`,"Rester connecté");
    idleWarned=false;
    if(stay&&user)markActive();
  }
}
setInterval(checkIdle,15*1000);
// téléphone verrouillé ou onglet en arrière-plan : on vérifie dès le retour
document.addEventListener("visibilitychange",()=>{if(!document.hidden)checkIdle()});
boot();
</script>
